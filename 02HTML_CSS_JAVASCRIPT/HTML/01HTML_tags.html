<!-- 주석 만들기: ctrl + / -->
<!-- html5 - 현재 사용 버전전 -->
<!-- !+enter: 기본 틀 -->

<!DOCTYPE html>     <!-- html5 문서임을 선언 -->
<html lang="ko">    <!-- 주 언어를 한국어로 설정정-->
<head>  
    <meta charset="UTF-8">      <!-- 인코딩 방식 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      <!-- 해상도 관련 정보 -->
    <!-- css 링크-->
    <!-- javascript 링크 첨부 가능 -->
    <title>01_html_tags</title>     <!-- 웹페이지 탭에 적혀있는 글-->
</head>

<!-- 웹브라우저에 내용을 출력하는 공간 -->
<body>
    <!-- 태그(tag): 웹브라우저가 웹 문서를 잘 이해할 수 있도록 콘텐츠를 목적에 맞게 분류한 규칙 -->
    <!-- 태그는 여는 태그, 닫는 태그로 구성 -->
    <p>여는 태그와 닫는 태그 사이에 내용을 입력합니다.</p>

    <!-- br, hr과 같은 태그는 닫는 태그가 없음 -->
    <br>
    <br><br>

    <p>여는 태그와 닫는 태그 사이에 내용을 입력합니다.</p>

    <!-- 부모 태그와 자식 태그, 조상(할머니/할아버지 이상) 태그 -->
     <!-- 표 만드는 방식 : table tr 행 td 열 -->
    <table>             <!-- border='1' 추가하면 선 생김-->
        <tr>
            <td>1</td>
            <td>2</td>
        </tr>
        <tr>
            <td>3</td>
            <td>4</td>
        </tr>
    </table> <!-- 이 상황에서 td의 부모는 tr, tr의 부모는 table / html과 head, body는 부모 / head와 body는 형제 관계 -->

</body>
</html>
